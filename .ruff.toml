# Kept at the repo root rather than in pyproject.toml so that editors, the local
# `ruff` CLI and qlty's bundled ruff all agree on one configuration.
line-length = 100
target-version = "py313"
src = ["src"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[lint.per-file-ignores]
# Mostly long JavaScript string literals; wrapping them hurts readability.
"src/grocery/stores/coop/extractors.py" = ["E501"]
# typer.Option/Argument in a default is the framework's intended usage.
"src/grocery/cli.py" = ["B008"]
