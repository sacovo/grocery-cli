[project]
name = "grocery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "playwright>=1.62.0",
    "typer>=0.27.1",
    "uvicorn>=0.35.0",
]

[project.scripts]
coop = "grocery.cli:main"
migros = "grocery.cli:main"
grocery = "grocery.cli:main"
grocery-api = "grocery.api:main"

[dependency-groups]
# httpx is what fastapi.testclient drives requests through.
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.14.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery"]

# Lint/format configuration lives in .ruff.toml at the repo root.
