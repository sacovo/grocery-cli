[project]
name = "coop-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.62.0",
    "typer>=0.27.1",
]

[project.scripts]
coop = "coop_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coop_api"]

# Lint/format configuration lives in .ruff.toml at the repo root.
