[project]
name = "grocery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.62.0",
    "typer>=0.27.1",
]

[project.scripts]
coop = "grocery.cli:main"
migros = "grocery.cli:main"
grocery = "grocery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery"]

# Lint/format configuration lives in .ruff.toml at the repo root.
